<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match-Three Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }

        .info div {
            padding: 10px 20px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            color: #667eea;
        }

        .moves {
            color: #764ba2;
        }

        #game-board {
            display: inline-grid;
            grid-template-columns: repeat(6, 50px);
            gap: 4px;
            background: #e0e0e0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .piece {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            transition: all 0.2s;
            background: white;
        }

        .piece:hover {
            transform: scale(1.05);
        }

        .piece.selected {
            border: 3px solid #333;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .piece:active {
            transform: scale(0.95);
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            text-align: center;
        }

        .game-over.show {
            display: block;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .game-over h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #667eea;
        }

        .game-over p {
            font-size: 20px;
            margin-bottom: 20px;
            color: #666;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        .message {
            height: 25px;
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Match-Three Game</h1>

        <div class="info">
            <div>Pontos: <span class="score">0</span></div>
            <div>Movimentos: <span class="moves">0</span></div>
        </div>

        <div class="message" id="message"></div>

        <div id="game-board"></div>

        <button onclick="resetGame()">Novo Jogo</button>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="game-over">
        <h2>Fim de Jogo!</h2>
        <p>Pontos finais: <span id="final-score">0</span></p>
        <button onclick="resetGame()">Jogar Novamente</button>
    </div>

    <script>
        const GRID_SIZE = 6;
        const COLORS = ['🔴', '🟡', '🟢', '🔵', '🟣', '🟠'];
        const MATCH_LENGTH = 3;

        let grid = [];
        let score = 0;
        let moves = 0;
        let selectedPiece = null;
        let isAnimating = false;
        let gameOver = false;

        function initializeGrid() {
            grid = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                grid[i] = [];
                for (let j = 0; j < GRID_SIZE; j++) {
                    grid[i][j] = COLORS[Math.floor(Math.random() * COLORS.length)];
                }
            }
            removeInitialMatches();
        }

        function removeInitialMatches() {
            let hasMatches = true;
            while (hasMatches) {
                hasMatches = false;
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (findMatches(i, j).length > 0) {
                            grid[i][j] = COLORS[Math.floor(Math.random() * COLORS.length)];
                            hasMatches = true;
                        }
                    }
                }
            }
        }

        function renderBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const button = document.createElement('button');
                    button.className = 'piece';
                    button.textContent = grid[i][j];
                    button.onclick = () => selectPiece(i, j, button);
                    button.id = `piece-${i}-${j}`;
                    if (selectedPiece && selectedPiece.row === i && selectedPiece.col === j) {
                        button.classList.add('selected');
                    }
                    board.appendChild(button);
                }
            }
            updateScore();
        }

        function selectPiece(row, col, button) {
            if (isAnimating || gameOver) return;

            if (selectedPiece) {
                const dist = Math.abs(selectedPiece.row - row) + Math.abs(selectedPiece.col - col);

                if (dist === 1) {
                    swapPieces(selectedPiece.row, selectedPiece.col, row, col);
                    selectedPiece = null;
                } else {
                    selectedPiece = { row, col };
                }
            } else {
                selectedPiece = { row, col };
            }
            renderBoard();
        }

        function swapPieces(r1, c1, r2, c2) {
            isAnimating = true;
            moves++;
            [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
            renderBoard();

            setTimeout(() => {
                if (!checkMatches()) {
                    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
                    showMessage('Movimento inválido! Nenhum match.');
                    renderBoard();
                    isAnimating = false;
                } else {
                    processMatches();
                }
            }, 300);
        }

        function checkMatches() {
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (findMatches(i, j).length > 0) return true;
                }
            }
            return false;
        }

        function findMatches(row, col) {
            const matches = new Set();
            const color = grid[row][col];

            // Verificar horizontal
            let count = 1;
            for (let j = col + 1; j < GRID_SIZE && grid[row][j] === color; j++) {
                count++;
            }
            for (let j = col - 1; j >= 0 && grid[row][j] === color; j--) {
                count++;
            }
            if (count >= MATCH_LENGTH) {
                for (let j = col - 1; j >= 0 && grid[row][j] === color; j--) matches.add(`${row}-${j}`);
                for (let j = col; count > 0; j++, count--) matches.add(`${row}-${j}`);
            }

            // Verificar vertical
            count = 1;
            for (let i = row + 1; i < GRID_SIZE && grid[i][col] === color; i++) {
                count++;
            }
            for (let i = row - 1; i >= 0 && grid[i][col] === color; i--) {
                count++;
            }
            if (count >= MATCH_LENGTH) {
                for (let i = row - 1; i >= 0 && grid[i][col] === color; i--) matches.add(`${i}-${col}`);
                for (let i = row; count > 0; i++, count--) matches.add(`${i}-${col}`);
            }

            return Array.from(matches);
        }

        function processMatches() {
            let matchesFound = new Set();

            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const matches = findMatches(i, j);
                    matches.forEach(m => matchesFound.add(m));
                }
            }

            if (matchesFound.size > 0) {
                score += matchesFound.size * 10;
                matchesFound.forEach(match => {
                    const [row, col] = match.split('-').map(Number);
                    grid[row][col] = null;
                });

                renderBoard();
                setTimeout(() => {
                    applyGravity();
                    setTimeout(() => {
                        fillEmptySpaces();
                        setTimeout(() => {
                            if (checkMatches()) {
                                processMatches();
                            } else {
                                isAnimating = false;
                                checkGameOver();
                            }
                        }, 300);
                    }, 300);
                }, 300);
            } else {
                isAnimating = false;
                checkGameOver();
            }
        }

        function applyGravity() {
            for (let j = 0; j < GRID_SIZE; j++) {
                let writePos = GRID_SIZE - 1;
                for (let i = GRID_SIZE - 1; i >= 0; i--) {
                    if (grid[i][j] !== null) {
                        grid[writePos][j] = grid[i][j];
                        if (writePos !== i) grid[i][j] = null;
                        writePos--;
                    }
                }
            }
            renderBoard();
        }

        function fillEmptySpaces() {
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (grid[i][j] === null) {
                        grid[i][j] = COLORS[Math.floor(Math.random() * COLORS.length)];
                    }
                }
            }
            renderBoard();
        }

        function checkGameOver() {
            let hasValidMove = false;

            for (let i = 0; i < GRID_SIZE && !hasValidMove; i++) {
                for (let j = 0; j < GRID_SIZE && !hasValidMove; j++) {
                    // Tentar swap horizontal
                    if (j < GRID_SIZE - 1) {
                        [grid[i][j], grid[i][j + 1]] = [grid[i][j + 1], grid[i][j]];
                        hasValidMove = checkMatches();
                        [grid[i][j], grid[i][j + 1]] = [grid[i][j + 1], grid[i][j]];
                    }
                    // Tentar swap vertical
                    if (!hasValidMove && i < GRID_SIZE - 1) {
                        [grid[i][j], grid[i + 1][j]] = [grid[i + 1][j], grid[i][j]];
                        hasValidMove = checkMatches();
                        [grid[i][j], grid[i + 1][j]] = [grid[i + 1][j], grid[i][j]];
                    }
                }
            }

            if (!hasValidMove) {
                gameOver = true;
                showGameOver();
            }
        }

        function showMessage(msg) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = msg;
            setTimeout(() => {
                messageEl.textContent = '';
            }, 2000);
        }

        function showGameOver() {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('game-over').classList.add('show');
            document.getElementById('final-score').textContent = score;
        }

        function updateScore() {
            document.querySelector('.score').textContent = score;
            document.querySelector('.moves').textContent = moves;
        }

        function resetGame() {
            score = 0;
            moves = 0;
            selectedPiece = null;
            isAnimating = false;
            gameOver = false;
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('game-over').classList.remove('show');
            document.getElementById('message').textContent = '';
            initializeGrid();
            renderBoard();
        }

        // Inicializar jogo
        resetGame();
    </script>
</body>
</html>
